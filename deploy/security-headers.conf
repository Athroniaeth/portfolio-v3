# Included per location rather than set once on the server block: nginx does not
# inherit add_header into a child block that declares any add_header of its own, so
# /assets/ — which sets Cache-Control — would silently lose every header below.

# Never let a browser second-guess a Content-Type; that is how a .js served as text
# ends up executed, or an upload gets sniffed into something active.
add_header X-Content-Type-Options "nosniff" always;

# No framing at all. frame-ancestors in the CSP says the same thing to modern
# browsers; this covers the ones that only know the older header.
add_header X-Frame-Options "DENY" always;

# Send the origin cross-site, the full path only to ourselves — so an outbound link
# never leaks a path or query string that identifies a user.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site asks for no camera, microphone, geolocation or payment API, so deny them
# outright. Costs nothing and removes them from the attack surface of any script that
# ever does run here.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Everything is self-hosted: the bundle, the font, the images, and the analytics
# script and its endpoint (nginx proxies /op/ to the OpenPanel instance, so the
# browser only ever talks to this origin). That is what keeps every directive below at
# 'self' with no third-party allow-list.
#
# $csp_script_hash is the sha256 of the inline theme script the prerenderer puts in
# every <head> — it has to be inline to run before first paint and prevent a flash of
# the wrong theme, and a hash is what allows exactly that one script without opening
# the door to 'unsafe-inline'. It is generated into deploy/csp-script-hash.conf by
# `just build` and defined as a map there, because nginx has no way to set a variable
# at http level and this file is included too late.
#
# style-src needs 'unsafe-inline' for nothing: Tailwind emits a real stylesheet and no
# component sets a style attribute. img-src allows data: for inlined SVG only.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' '$csp_script_hash'; connect-src 'self'; font-src 'self'; form-action 'self'" always;
